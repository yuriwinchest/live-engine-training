[project]
name = "live-lab"
version = "0.1.0"
description = "Laboratório de dados e treino do L.I.V.E. (voz → número de peito)"
readme = "README.md"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "soundfile>=0.12",
]

[project.scripts]
live-lab = "live_lab.cli:main"

# Motores TTS não entram no lock: puxam torch e versões conflitantes entre si.
# São instalados no ambiente de síntese (Colab), um por vez; ver colab/sintese.ipynb.

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["live_lab"]

[tool.uv]
python-preference = "managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["colab"]  # notebook com comandos de shell (!pip, !apt), não é módulo

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Travessão (–) é pontuação do português nas mensagens, não confusão com hífen.
allowed-confusables = ["–"]

# mypy é compilado (mypyc); o Smart App Control desta máquina bloqueia a DLL. Roda no Colab/Linux.
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
